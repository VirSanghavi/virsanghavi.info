<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
  <title>Search | Vir Sanghavi</title>
  <meta name="description" content="Search all posts by Vir Sanghavi." />
</head>

<body>
  <div class="page">
    <header>
      <div class="header-inner">
        <div class="site-title"><a href="/">Vir Sanghavi</a></div>
        <input type="checkbox" id="nav-check" class="nav-check" aria-hidden="true" />
        <label for="nav-check" class="nav-toggle" aria-label="Toggle menu">
          <span class="icon-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg></span>
          <span class="icon-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12" />
            </svg></span>
        </label>
        <nav class="nav-links">
          <a href="/">Posts</a>
          <a href="/about.html">About</a>
          <button id="game-toggle" class="nav-game-btn" type="button" aria-label="Play game"
            title="Play game">Play</button>
          <div class="nav-utils">
            <a href="/search.html" class="active-nav" aria-label="Search"><svg class="nav-icon" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg></a>
            <button id="theme-toggle" aria-label="Toggle dark mode"><svg class="nav-icon" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
              </svg></button>
          </div>
        </nav>
      </div>
      <div class="content-wrap">
        <hr class="border" />
      </div>
    </header>

    <section>
      <div class="search-section">
        <h1>Search</h1>
        <p class="search-sub">Search any article ...</p>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input type="text" id="search-input" placeholder="Search posts, e.g. 'YC rejection'" autocomplete="off"
            autofocus />
        </div>
        <ul id="search-results" class="search-results"></ul>
      </div>
    </section>

    <footer id="site-footer"></footer>
  </div>

  <script src="/components/theme.js"></script>
  <script src="/components/search.js"></script>
  <script src="/components/game.js"></script>
  <script src="/components/footer.js"></script>
</body>

</html>
